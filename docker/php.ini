; ===== Réglages PHP de production pour GestImmo =====
memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 12M
max_execution_time = 120
expose_php = Off
date.timezone = Africa/Casablanca
session.cookie_httponly = 1
session.use_strict_mode = 1
session.cookie_samesite = Lax

; ----- OPcache : cache du bytecode -----
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; En production : ne pas vérifier les fichiers à chaque requête (redémarrer PHP-FPM au déploiement)
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.save_comments = 1
opcache.jit = tracing
opcache.jit_buffer_size = 64M
; Préchargement des classes du noyau
opcache.preload = /var/www/html/preload.php
opcache.preload_user = www-data

; ----- APCu : cache de données en mémoire partagée -----
apc.enabled = 1
apc.shm_size = 128M
apc.ttl = 7200
apc.enable_cli = 0
apc.serializer = php

; ----- realpath cache -----
realpath_cache_size = 4096K
realpath_cache_ttl = 600
